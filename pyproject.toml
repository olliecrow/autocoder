[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "autocoder"
dynamic = ["version"]
description = "local per-repo GitHub + Codex orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[project.scripts]
autocoder = "autocoder.cli:main"

[project.urls]
Repository = "https://github.com/olliecrow/autocoder"

[tool.hatch.version]
path = "src/autocoder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/autocoder"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
