[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "autocoder"
dynamic = ["version"]
description = "local per-repo GitHub + Codex orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
autocoder = "autocoder.cli:main"

[project.urls]
Repository = "https://github.com/olliecrow/autocoder"

[tool.hatch.version]
path = "src/autocoder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/autocoder"]
